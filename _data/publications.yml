- title: "Sutradhara: An Intelligent Orchestrator-Engine Co-design for Tool-based Agentic Inference"
  authors: "Anish Biswas, Kanishk Goel, Srivarshinee S, Jayashree Mohan, Alind Khare, Anjaly Parayil, Ramachandran Ramjee, Chetan Bansal"
  venue: "arXiv, 2026"
  image: "/images/publications/sutradhara.png"
  abstract: "We present Sutradhara, a co-designed agentic inference system that integrates orchestration with LLM serving through a thin API enabling three optimizations: tool-aware prompt splitting, streaming tool execution, and orchestrator-aware cache management. Implemented on vLLM, Sutradhara sustains up to 77% higher load at the same median FTR latency, or reduces median FTR latency by up to 15% at the same load."
  pdf: "https://arxiv.org/pdf/2601.12967"

- title: "CLINIC: Evaluating Multilingual Trustworthiness in Language Models for Healthcare"
  authors: "Akash Ghosh, Srivarshinee Sridhar, Raghav Kaushik Ravi, Muhsin Muhsin, Sriparna Saha, Chirag Agarwal"
  venue: "arXiv, 2025"
  image: "/images/publications/clinic.png"
  abstract: "We present CLINIC, a Comprehensive Multilingual Benchmark to evaluate the trustworthiness of language models in healthcare across five key dimensions: truthfulness, fairness, safety, robustness, and privacy, operationalized through 18 diverse tasks, spanning 15 languages."
  pdf: "https://arxiv.org/pdf/2512.11437"

- title: "Pre-Normalization Momentum and Rank Bias in Adaptive Optimizers"
  authors: "Raghav Kaushik Ravi, Srivarshinee Sridhar"
  venue: "ICML 2026 WSS Workshop"
  image: "/images/publications/wssicml.png"
  abstract: "Adaptive optimizers induce strikingly different implicit rank biases. Adam reliably recovers low-rank solutions in deep matrix factorization, whereas RMSProp substantially overshoots despite using the same adaptive normalization mechanism. We trace much of this behavior to Adam's pre-normalization momentum, which suppresses fluctuations in trailing directions that would otherwise inflate rank. Together, these results suggest that pre-normalization temporal filtering is an important source of optimizer-induced spectral bias."
  pdf: "https://openreview.net/pdf?id=aLhQNH4k7C"

- title: "Mapping Clinical Doubt: Locating Linguistic Uncertainty in LLMs"
  authors: "Srivarshinee Sridhar, Raghav Kaushik Ravi, Kripabandhu Ghosh"
  venue: "AAAI 2026 SECURE-AI4H Workshop"
  image: "/images/publications/uncert.png"
  abstract: "We examine input-side representational sensitivity to linguistic uncertainty in medical text and propose Model Sensitivity to Uncertainty (MSU), a layerwise probing metric that quantifies activation-level shifts induced by uncertainty cues. Our results show that LLMs exhibit structured, depth-dependent sensitivity to clinical uncertainty."
  pdf: "https://arxiv.org/pdf/2511.22402"
