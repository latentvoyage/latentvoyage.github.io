<div class="timeline-section" id="timeline">
  <h2>Timeline</h2>
  <div class="timeline-scroll">
    {% for item in site.data.timeline %}
    <div class="timeline-item">
      <div class="timeline-date">{{ item.date }}</div>
      <div class="timeline-content">{{ item.content }}</div>
    </div>
    {% endfor %}
  </div>
</div>
